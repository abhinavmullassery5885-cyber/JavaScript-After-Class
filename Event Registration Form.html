<!DOCTYPE html>
<html>

<head>
    <title>School Fest Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff7ed;
            color: #333333;
            text-align: center;
        }

        .form-card {
            width: 520px;
            background-color: white;
            border: 3px solid #f97316;
            border-radius: 18px;
            margin: 40px auto;
            padding: 25px;
            box-shadow: 0 0 18px #fdba74;
        }

        h1 {
            color: #ea580c;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-top: 12px;
        }

        input,
        select {
            width: 95%;
            padding: 10px;
            margin-top: 6px;
            border: 2px solid #fdba74;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            background-color: #f97316;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 18px;
        }

        button:hover {
            background-color: #c2410c;
        }

        #feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            line-height: 1.6;
        }

        .success {
            background-color: #dcfce7;
            color: #166534;
            border: 2px solid #22c55e;
        }

        .error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 2px solid #ef4444;
        }
    </style>
</head>

<body>

    <div class="form-card">

        <h1>School Fest Registration</h1>

        <p>
            Join our exciting school fest! Enter your details below
            to register and receive your participation pass.
        </p>

        <form id="eventForm">

            <label for="studentName">Full Name</label>
            <input type="text" id="studentName" required minlength="3" placeholder="Enter your full name">

            <label for="email">Student Email</label>
            <input type="email" id="email" required placeholder="Enter your email address">

            <label for="age">Student Age</label>
            <input type="number" id="age" required min="8" max="18" placeholder="Enter your age">

            <label for="eventName">Select Your Activity</label>
            <select id="eventName" required>
                <option value="">Choose an activity</option>
                <option value="Dance Show">Dance Show</option>
                <option value="Quiz Competition">Quiz Competition</option>
                <option value="Drawing Contest">Drawing Contest</option>
                <option value="Music Performance">Music Performance</option>
            </select>

            <button type="button" onclick="registerEvent()">
                Join the Fest
            </button>

        </form>

        <div id="feedback">
            Waiting for your details...
        </div>

    </div>

    <script>
        function registerEvent() {

            let form = document.getElementById("eventForm");
            let feedback = document.getElementById("feedback");

            try {

                // Checking Form Validation
                if (!form.checkValidity()) {
                    form.reportValidity();
                    throw "Please enter valid details.";
                }

                // Collecting Student Information
                let studentName = document.getElementById("studentName").value;
                let email = document.getElementById("email").value;
                let age = Number(document.getElementById("age").value);
                let eventName = document.getElementById("eventName").value;

                // Checking Registration Details
                if (studentName.length < 3) {
                    throw "Name should contain at least 3 characters.";
                }

                if (age < 8 || age > 18) {
                    throw "Age should be between 8 and 18.";
                }

                if (eventName === "") {
                    throw "Please choose an activity.";
                }

                // Displaying Processing Message
                feedback.className = "";
                feedback.innerHTML = "Processing your school fest registration...";

                // Generating a Random Pass Number
                setTimeout(function () {

                    let passNumber = Math.floor(Math.random() * 9000) + 1000;

                    feedback.className = "success";
                    feedback.innerHTML =
                        "You're Successfully Registered!<br>" +
                        "Name: " + studentName + "<br>" +
                        "Email: " + email + "<br>" +
                        "Age: " + age + "<br>" +
                        "Activity: " + eventName + "<br>" +
                        "Your Fest Pass: FEST-" + passNumber;

                }, 2000);

            } catch (error) {

                // Displaying Error Messages
                feedback.className = "error";
                feedback.innerHTML = "Registration Error: " + error;

            }
        }
    </script>

</body>

</html>
